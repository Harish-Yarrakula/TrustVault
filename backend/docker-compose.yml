services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    mem_limit: 5g
    cpus: 1.25
    networks:
      - trustvault-internal

  backend:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.75
    env_file:
      - /etc/trustvault/backend.env
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      - clamav
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - trustvault-internal

networks:
  trustvault-internal:
    driver: bridge
